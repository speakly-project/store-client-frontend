<section class="p-cursos">
    <div class="p-cursos__header">
        <div class="p-cursos__header-top">
            <h1>Explore Language Courses</h1>
        </div>
    </div>

    <div class="p-cursos__filters-row">
        <div class="p-cursos__filters">
            <div class="p-cursos__filters-group">
                <label class="p-cursos__filters-label">Language</label>
                <select class="p-cursos__filters-select" #language (change)="fetchCourses(language.value, level.value, minPrice.toString(), maxPrice.toString(), sortBy.value)">
                    <option value="">All</option>
                    @for (lang of languages; track lang.code) {
                    <option [value]="lang.name">{{ lang.name }}</option>
                    }
                </select>
            </div>
            <div class="p-cursos__filters-group">
                <label class="p-cursos__filters-label">Level</label>
                <select class="p-cursos__filters-select" #level (change)="fetchCourses(language.value, level.value, minPrice.toString(), maxPrice.toString(), sortBy.value)">
                    <option value="">All</option>
                    @for (lvl of levels; track lvl.name) {
                    <option [value]="lvl.name">{{ lvl.name }}</option>
                    }
                </select>
            </div>
            <div class="p-cursos__filters-group p-cursos__filters-group--price">
                <label class="p-cursos__filters-label">Price Range</label>
                <div class="p-cursos__filters-price-wrapper">
                    <div class="p-cursos__filters-price-inputs">
                        <input class="p-cursos__filters-price-input" type="number" [(ngModel)]="minPrice" (blur)="updateMinPrice(minPrice)" [min]="priceRange.min" [max]="priceRange.max" />
                        <span class="p-cursos__filters-price-separator">-</span>
                        <input class="p-cursos__filters-price-input" type="number" [(ngModel)]="maxPrice" (blur)="updateMaxPrice(maxPrice)" [min]="priceRange.min" [max]="priceRange.max" />
                    </div>
                    <div class="p-cursos__filters-slider">
                        <mat-slider [min]="priceRange.min" [max]="priceRange.max" [step]="1">
                            <input matSliderStartThumb [(ngModel)]="minPrice" (ngModelChange)="updateMinPrice($any($event))" />
                            <input matSliderEndThumb [(ngModel)]="maxPrice" (ngModelChange)="updateMaxPrice($any($event))" />
                        </mat-slider>
                    </div>
                </div>
            </div>
            <div class="p-cursos__filters-group">
                <label class="p-cursos__filters-label">Order by</label>
                <select class="p-cursos__filters-select" #sortBy (change)="fetchCourses(language.value, level.value, minPrice.toString(), maxPrice.toString(), sortBy.value)">
                    <option value="">All</option>
                    <option value="ascPrice">Ascending price</option>
                    <option value="descPrice">Descending price</option>
                </select>
            </div>
            <button class="p-cursos__filters-button" (click)="fetchCourses(language.value, level.value, minPrice.toString(), maxPrice.toString(), sortBy.value)">Search</button>
        </div>
    </div>

    <div class="p-cursos__results">
        <div class="p-cursos__results-count">{{ totalElements || courses.length }} courses found</div>
    </div>



    <div class="p-cursos__grid">
        @for (c of courses; track $index) {
        <c-curso [course]="c"></c-curso>
        }
    </div>

    @if (totalPages > 1) {
    <div class="p-cursos__pagination">
        <button class="p-cursos__pagination-button" (click)="goToPage(1)" [disabled]="currentPage === 1">&lt;&lt;</button>
        <button class="p-cursos__pagination-button" (click)="prevPage()" [disabled]="currentPage === 1">&lt;</button>
        @for (p of pages; track p) {
        <button class="p-cursos__pagination-button" [class.p-cursos__pagination-button--active]="currentPage === p" (click)="goToPage(p)">{{ p }}</button>
        }
        <button class="p-cursos__pagination-button" (click)="nextPage()" [disabled]="currentPage === totalPages">&gt;</button>
        <button class="p-cursos__pagination-button" (click)="goToPage(totalPages)" [disabled]="currentPage === totalPages">&gt;&gt;</button>
    </div>
    }
</section>
